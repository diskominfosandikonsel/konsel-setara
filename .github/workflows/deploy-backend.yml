name: Auto Deploy Backend KONSEL-SETARA

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            echo "🚀 [1/4] Memulai proses deployment backend..."
            # Masuk ke root folder project dengan nama yang baru
            cd ~/App/konsel-setara
            
            echo "⬇️ [2/4] Menarik perubahan kode terbaru dari Git..."
            git pull origin main
            
            # Masuk ke folder backend untuk install dan PM2
            cd backend
            
            echo "📦 [3/4] Memasang dependensi baru (jika ada)..."
            npm install --omit=dev
            
            echo "🔄 [4/4] Mereload proses PM2 'KONSEL-SETARA' (Zero-Downtime)..."
            pm2 reload KONSEL-SETARA --update-env || pm2 restart KONSEL-SETARA
            
            echo "✅ Deployment Backend KONSEL-SETARA Berhasil Selesai!"
