<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Soft Outer Glow / Background Circle -->
  <circle cx="40" cy="40" r="38" fill="#E1F0FF" />
  
  <!-- Clipboard Body -->
  <rect x="22" y="16" width="36" height="48" rx="8" fill="#3B82F6" />
  
  <!-- Inner White Paper -->
  <rect x="25" y="20" width="30" height="41" rx="5" fill="#FFFFFF" />
  
  <!-- Top Clip Hardware -->
  <path d="M32 13C32 11.8954 32.8954 11 34 11H46C47.1046 11 48 11.8954 48 13V17C48 18.1046 47.1046 19 46 19H34C32.8954 19 32 18.1046 32 17V13Z" fill="#1D4ED8" />
  <circle cx="40" cy="15" r="2" fill="#FFFFFF" />

  <!-- "RUP" Text on Document -->
  <text x="40" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#1E40AF" text-anchor="middle" letter-spacing="1">RUP</text>

  <!-- Document Content Lines -->
  <rect x="29" y="39" width="22" height="2" rx="1" fill="#93C5FD" />
  <rect x="29" y="44" width="18" height="2" rx="1" fill="#93C5FD" />
  <rect x="29" y="49" width="14" height="2" rx="1" fill="#93C5FD" />

  <!-- Verification Badge with Checkmark -->
  <circle cx="53" cy="54" r="10" fill="#2563EB" />
  <path d="M49 54L52 57L57 51" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
